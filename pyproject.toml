[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-feature-pipeline"
version = "1.0.0"
description = "BIDS-native resting-state EEG preprocessing and feature analysis pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "Isha Vats"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mne>=1.6,<2",
  "mne-bids>=0.15,<1",
  "mne-connectivity>=0.7,<1",
  "numpy>=1.23,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pybv>=0.7,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
eeg-feature-pipeline = "eeg_feature_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
